name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.8"

      - name: Install poppler-utils (pdftotext, pdfinfo)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Vendored engine tests
        run: python3 scripts/run_tests.py

      - name: Adjudicator tests (must reject invented figures, dates and quotes)
        run: python3 scripts/test_adjudicate.py

      - name: ExtractPdf, CaptureWeb and CaptureVideo tests (symlinks, collisions, OCR guard, topic validation, HTML-to-text, bylines and references, VTT parsing)
        run: bun test scripts/

      - name: Adjudicator on the empty skeleton (exit status is the gate)
        run: python3 scripts/AdjudicateSuspects.py
