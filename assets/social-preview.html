<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Verbatim social preview</title>
<style>
  :root {
    --bg: #0e1319;
    --ink: #f2f5f8;
    --muted: #93a3b8;
    --ok: #3fb950;
    --ok-soft: rgba(63, 185, 80, 0.18);
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "DejaVu Serif", "Liberation Serif", serif;
    --mono: ui-monospace, "SF Mono", "DejaVu Sans Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "DejaVu Sans", "Liberation Sans", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; background: var(--bg); overflow: hidden; }
  .card {
    position: relative; width: 1280px; height: 640px; overflow: hidden;
    background: radial-gradient(900px 520px at 78% 45%, rgba(63, 185, 80, 0.07), transparent 70%), var(--bg);
    font-family: var(--sans); color: var(--ink);
  }
  .left { position: absolute; left: 72px; top: 0; width: 560px; height: 640px; }
  .eyebrow {
    position: absolute; top: 68px; left: 0; font-family: var(--mono); font-size: 22px;
    letter-spacing: 0.14em; color: #b8c2cf; text-transform: uppercase;
  }
  .wordmark {
    position: absolute; top: 112px; left: -3px; font-family: var(--serif); font-weight: 700;
    font-size: 112px; letter-spacing: -0.02em; line-height: 1; color: var(--ink); white-space: nowrap;
  }
  .wordmark .dot { color: var(--ok); }
  .tagline {
    position: absolute; top: 270px; left: 0; width: 560px; font-family: var(--serif);
    font-size: 42px; line-height: 1.18; color: var(--ink);
  }
  .sub {
    position: absolute; top: 398px; left: 0; width: 548px; font-size: 28px; line-height: 1.38; color: #b8c2cf;
  }
  .status {
    position: absolute; top: 536px; left: 0; display: flex; align-items: center; gap: 14px;
    font-family: var(--mono); font-size: 24px; color: #d3dbe5;
    padding: 11px 20px; border: 1.5px solid #34445a; border-radius: 10px;
    background: #151c26;
  }
  .status svg { flex: none; }
  .right { position: absolute; left: 688px; top: 84px; width: 528px; height: 524px; }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="eyebrow">Method template &middot; LLM wikis</div>
    <div class="wordmark">Verbatim<span class="dot">.</span></div>
    <div class="tagline">LLM wikis that can&rsquo;t misquote their sources.</div>
    <div class="sub">Every checked quote, date and figure must exist verbatim in a linked source.</div>
    <div class="status">
      <span><span style="color:#3fb950">$</span> exit 1 on a real mismatch</span>
    </div>
  </div>

  <div class="right">
    <svg width="528" height="524" viewBox="0 0 528 524" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace">
      <!-- Panel 1: the wiki page, one quote that holds and one that does not -->
      <rect x="0.75" y="0.75" width="526.5" height="212" rx="14" fill="#151c26" stroke="#263241" stroke-width="1.5"/>
      <text x="24" y="42" font-size="23" fill="#d3dbe5" letter-spacing="0.3">wiki/summaries/q3.md</text>

      <rect x="16" y="64" width="400" height="50" rx="9" fill="rgba(63,185,80,0.18)"/>
      <text x="28" y="97" font-size="26" fill="#f2f5f8" textLength="376" lengthAdjust="spacingAndGlyphs">&quot;Churn fell to 13.5 points&quot;</text>
      <circle cx="486" cy="89" r="18" fill="#3fb950"/>
      <path d="M477 89.5l6.5 6.5 11.5-13.5" fill="none" stroke="#0e1319" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="16" y="130" width="296" height="50" rx="9" fill="rgba(248,81,73,0.16)"/>
      <text x="28" y="163" font-size="26" fill="#f2f5f8" textLength="272" lengthAdjust="spacingAndGlyphs">&quot;4,200 customers&quot;</text>
      <circle cx="486" cy="155" r="18" fill="#f85149"/>
      <path d="M478 147l16 16M494 147l-16 16" fill="none" stroke="#0e1319" stroke-width="3.4" stroke-linecap="round"/>

      <!-- Connector -->
      <line x1="264" y1="216" x2="264" y2="262" stroke="#b8c2cf" stroke-width="3" stroke-dasharray="6 6"/>
      <path d="M255 254l9 11 9-11" fill="none" stroke="#b8c2cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="288" y="246" font-size="24" fill="#d3dbe5" letter-spacing="0.2">grep the source</text>

      <!-- Panel 2: the raw source -->
      <rect x="0.75" y="270.75" width="526.5" height="212" rx="14" fill="#151c26" stroke="#263241" stroke-width="1.5"/>
      <text x="24" y="312" font-size="23" fill="#d3dbe5" letter-spacing="0.3">raw/q3/deck.md</text>

      <rect x="16" y="334" width="392" height="50" rx="9" fill="rgba(63,185,80,0.18)"/>
      <text x="28" y="367" font-size="26" fill="#f2f5f8" textLength="368" lengthAdjust="spacingAndGlyphs">Churn fell to 13.5 points</text>
      <text x="420" y="367" font-size="26" fill="#9aa6b6" textLength="86" lengthAdjust="spacingAndGlyphs">in Q3.</text>

      <rect x="16" y="400" width="130" height="50" rx="9" fill="rgba(248,81,73,0.16)"/>
      <text x="28" y="433" font-size="26" fill="#f2f5f8" textLength="106" lengthAdjust="spacingAndGlyphs">14,000</text>
      <text x="160" y="433" font-size="26" fill="#9aa6b6" textLength="142" lengthAdjust="spacingAndGlyphs">customers</text>
    </svg>
  </div>
</div>
</body>
</html>
